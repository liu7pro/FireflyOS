<!DOCTYPE html>
<html lang="zh-CN" data-color-mode="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>页面未找到 — FireflyOS</title>
<meta name="theme-color" content="#060a10" />
<script>
  (function () {
    try {
      var saved = localStorage.getItem('ff-theme');
      var mode = saved === 'light' || saved === 'dark'
        ? saved
        : (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
      document.documentElement.setAttribute('data-color-mode', mode);
    } catch (e) {}
  })();
</script>
<style>
  :root {
    color-scheme: dark;
    --bg: #060a10;
    --text: #e9f2ee;
    --text-2: #9db1ab;
    --mint: #34d399;
    --amber: #fbbf24;
    --ink: #04130d;
    --border: rgba(255, 255, 255, .10);
    --glow: rgba(52, 211, 153, .16);
  }
  html[data-color-mode="light"] {
    color-scheme: light;
    --bg: #f3faf6;
    --text: #08201a;
    --text-2: #4b625b;
    --mint: #0f9d76;
    --amber: #b45309;
    --ink: #ffffff;
    --border: rgba(9, 65, 51, .12);
    --glow: rgba(15, 157, 118, .14);
  }
  html { background: var(--bg); }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    font-family: "Segoe UI Variable Display", "Segoe UI", "PingFang SC", "Microsoft YaHei UI", sans-serif;
    color: var(--text);
    background:
      radial-gradient(50% 40% at 50% 15%, var(--glow), transparent 70%),
      var(--bg);
    text-align: center;
  }
  .wrap { padding: 40px 24px; }
  img { width: 62px; height: 62px; margin: 0 auto 26px; border-radius: 18px; }
  .code {
    font-size: clamp(76px, 16vw, 132px);
    font-weight: 780;
    line-height: 1;
    letter-spacing: -.06em;
    background: linear-gradient(180deg, var(--text) 10%, var(--mint) 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    -webkit-text-fill-color: transparent;
  }
  h1 { margin: 18px 0 0; font-size: 20px; font-weight: 650; letter-spacing: -.01em; }
  p { margin: 10px 0 28px; font-size: 13.5px; color: var(--text-2); }
  a {
    display: inline-flex;
    align-items: center;
    height: 44px;
    padding: 0 24px;
    border-radius: 13px;
    font-size: 14px;
    font-weight: 600;
    color: var(--ink);
    background: var(--mint);
    text-decoration: none;
    box-shadow: 0 10px 28px var(--glow);
    transition: transform .25s ease;
  }
  a:hover { transform: translateY(-2px); }
  .star {
    display: inline-block;
    width: 5px; height: 5px;
    margin: 0 6px;
    border-radius: 50%;
    background: var(--amber);
    box-shadow: 0 0 10px var(--amber);
    vertical-align: middle;
  }
</style>
</head>
<body>
  <div class="wrap">
    <img src="assets/logo.svg" alt="FireflyOS" />
    <div class="code">404</div>
    <h1>这里没有页面</h1>
    <p>你访问的地址不存在<span class="star"></span>或者页面已经被移走。</p>
    <a href="/FireflyOS/">返回 FireflyOS 首页</a>
  </div>
</body>
</html>
