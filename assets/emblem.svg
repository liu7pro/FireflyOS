<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="FireflyOS">
  <defs>
    <radialGradient id="core" cx="50%" cy="45%" r="55%">
      <stop offset="0" stop-color="#fffdf2"/>
      <stop offset=".42" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </radialGradient>
    <linearGradient id="wing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ecfdf5" stop-opacity=".98"/>
      <stop offset=".45" stop-color="#6ee7b7" stop-opacity=".82"/>
      <stop offset="1" stop-color="#10b981" stop-opacity=".46"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a7f3d0"/>
      <stop offset="1" stop-color="#34d399" stop-opacity=".45"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#34d399" stop-opacity=".38"/>
      <stop offset="1" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.6"/>
    </filter>
  </defs>

  <circle cx="60" cy="58" r="48" fill="url(#halo)"/>

  <!-- 翅膀 -->
  <ellipse cx="35" cy="47" rx="23" ry="11.5" transform="rotate(-34 35 47)" fill="url(#wing)" opacity=".92" stroke="#34d399" stroke-opacity=".38" stroke-width="1.2"/>
  <ellipse cx="85" cy="47" rx="23" ry="11.5" transform="rotate(34 85 47)" fill="url(#wing)" opacity=".92" stroke="#34d399" stroke-opacity=".38" stroke-width="1.2"/>
  <path d="M46 44c-6-4-14-5-20-3 5 5 13 8 20 7" fill="none" stroke="#ecfdf5" stroke-opacity=".75" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M74 44c6-4 14-5 20-3-5 5-13 8-20 7" fill="none" stroke="#ecfdf5" stroke-opacity=".75" stroke-width="1.5" stroke-linecap="round"/>

  <!-- 触须 -->
  <path d="M56 38 50 31M64 38l6-7" stroke="#34d399" stroke-width="1.8" stroke-linecap="round" opacity=".85"/>
  <circle cx="49.4" cy="30" r="1.8" fill="#fbbf24"/>
  <circle cx="70.6" cy="30" r="1.8" fill="#fbbf24"/>

  <!-- 身体与光核 -->
  <rect x="55.6" y="45" width="8.8" height="31" rx="4.4" fill="url(#body)"/>
  <circle cx="60" cy="51" r="15" fill="url(#core)" opacity=".30" filter="url(#soft)"/>
  <circle cx="60" cy="51" r="9.2" fill="url(#core)"/>
  <circle cx="60" cy="51" r="4.4" fill="#fffdf0" opacity=".95"/>

  <!-- 尾迹 -->
  <circle cx="60" cy="84" r="2.6" fill="#6ee7b7" opacity=".85"/>
  <circle cx="60" cy="92" r="1.8" fill="#fbbf24" opacity=".7"/>
  <circle cx="60" cy="98.5" r="1.2" fill="#6ee7b7" opacity=".5"/>
</svg>
